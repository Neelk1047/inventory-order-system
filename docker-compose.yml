# Start everything (MySQL + the API) with:  docker compose up --build
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: inventory_db
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rootpass}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD:-rootpass}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: "jdbc:mysql://db:3306/inventory_db?allowPublicKeyRetrieval=true&useSSL=false"
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-rootpass}
    ports:
      - "8080:8080"

volumes:
  db_data: